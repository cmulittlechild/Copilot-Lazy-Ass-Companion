<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e1e1e" />
  <meta name="referrer" content="no-referrer" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />
  <title>Copilot Lazy Ass</title>
  <link rel="stylesheet" href="/codicon.css" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/vs2015.min.css" />
  <noscript>
    <style>.codicon::before { display: none !important; }</style>
  </noscript>
</head>
<body>
  <header class="top">
    <div class="brand">
      <div class="dot" id="statusDot"></div>
      <div class="brand-text">
        <div class="title" id="sessionTitle">Copilot Lazy Ass</div>
        <div class="sub" id="statusText">connecting…</div>
      </div>
    </div>
    <div class="top-actions">
      <button id="btnSessions" type="button" class="icon-btn codicon codicon-menu" aria-label="会话列表" title="会话列表"></button>
      <button id="btnTerminal" type="button" class="icon-btn codicon codicon-terminal" aria-label="终端" title="终端"></button>
      <button id="btnInstances" type="button" class="icon-btn codicon codicon-server" aria-label="实例" title="实例"></button>
    </div>
  </header>

  <main id="feed" class="feed" aria-live="polite"></main>

  <button id="btnScrollBottom" type="button" class="fab-scroll-bottom codicon codicon-arrow-down" aria-label="滚动到底部" title="滚动到底部"></button>

  <section id="confirmBar" class="confirm hidden"></section>

  <footer class="composer">
    <!-- 控件条：mode（agent/ask/edit）+ 模型选择 + 审批模式，三者为独立维度 -->
    <div id="composerControls" class="composer-controls">
      <select id="mode" class="ctrl-select" aria-label="mode">
        <option value="agent">Agent</option>
        <option value="ask">Ask</option>
        <option value="edit">Edit</option>
      </select>
      <button id="btnModel" type="button" class="ctrl-pill" aria-haspopup="dialog" aria-label="选择模型" title="选择模型">
        <span class="codicon codicon-sparkle ctrl-pill-icon"></span>
        <span id="btnModelLabel" class="ctrl-pill-text">模型</span>
        <span class="codicon codicon-chevron-down ctrl-caret"></span>
      </button>
      <button id="btnPermission" type="button" class="ctrl-pill" aria-haspopup="dialog" aria-label="审批模式" title="审批模式">
        <span class="codicon codicon-shield ctrl-pill-icon"></span>
        <span id="btnPermissionLabel" class="ctrl-pill-text">审批</span>
        <span class="codicon codicon-chevron-down ctrl-caret"></span>
      </button>
    </div>
    <textarea id="input" rows="1" placeholder="发消息到 VS Code Copilot…" enterkeyhint="send"></textarea>
    <button id="send" type="button">发送</button>
  </footer>

  <!-- 会话列表抽屉（右侧滑入） -->
  <div id="drawerOverlay" class="drawer-overlay hidden"></div>
  <aside id="sessionDrawer" class="session-drawer" aria-label="会话列表">
    <div class="drawer-header">
      <span class="drawer-title">会话</span>
      <button id="drawerClose" type="button" class="icon-btn codicon codicon-close" aria-label="关闭"></button>
    </div>
    <div class="drawer-search">
      <span class="codicon codicon-search drawer-search-icon"></span>
      <input id="sessionSearch" type="search" placeholder="搜索会话 / 工作区…" autocomplete="off" aria-label="搜索会话" />
    </div>
    <div id="sessionList" class="session-list"></div>
  </aside>

  <!-- VS Code 实例抽屉（右侧滑入，复用会话抽屉模式） -->
  <div id="instanceOverlay" class="drawer-overlay hidden"></div>
  <aside id="instanceDrawer" class="session-drawer" aria-label="VS Code 实例">
    <div class="drawer-header">
      <span class="drawer-title">VS Code 实例</span>
      <button id="instanceClose" type="button" class="icon-btn codicon codicon-close" aria-label="关闭"></button>
    </div>
    <div id="instanceList" class="session-list"></div>
  </aside>

  <!-- 终端面板（底部滑入） -->
  <section id="terminalPanel" class="terminal-panel" aria-label="终端">
    <div class="terminal-header">
      <span class="terminal-title">终端</span>
      <div class="terminal-tools">
        <select id="terminalSelect" class="terminal-select" aria-label="选择终端"></select>
        <button id="terminalClose" type="button" class="icon-btn codicon codicon-close" aria-label="关闭"></button>
      </div>
    </div>
    <div class="terminal-row">
      <input id="terminalInput" type="text" placeholder="输入命令…" autocomplete="off" enterkeyhint="send" />
      <button id="terminalExec" type="button">执行</button>
    </div>
    <pre id="terminalOutput" class="terminal-output"></pre>
  </section>

  <!-- 底部 sheet 共用遮罩（模型 / 审批模式） -->
  <div id="sheetOverlay" class="sheet-overlay hidden"></div>

  <!-- 模型选择 sheet（底部滑入） -->
  <section id="modelSheet" class="bottom-sheet" aria-label="选择模型" role="dialog">
    <div class="sheet-grabber"></div>
    <div class="sheet-header">
      <span class="sheet-title">选择模型</span>
      <button id="modelSheetClose" type="button" class="icon-btn codicon codicon-close" aria-label="关闭"></button>
    </div>
    <div class="sheet-search">
      <span class="codicon codicon-search sheet-search-icon"></span>
      <input id="modelSearch" type="search" placeholder="搜索模型…" autocomplete="off" aria-label="搜索模型" />
    </div>
    <div id="modelError" class="sheet-error hidden"></div>
    <div id="modelList" class="sheet-list"></div>
  </section>

  <!-- 审批模式 sheet（底部滑入） -->
  <section id="permissionSheet" class="bottom-sheet" aria-label="审批模式" role="dialog">
    <div class="sheet-grabber"></div>
    <div class="sheet-header">
      <span class="sheet-title">运行模式（审批）</span>
      <button id="permissionSheetClose" type="button" class="icon-btn codicon codicon-close" aria-label="关闭"></button>
    </div>
    <div id="permissionError" class="sheet-error hidden"></div>
    <div id="permissionList" class="sheet-list"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
